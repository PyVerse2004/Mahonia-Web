{% extends "base.html" %}

{% block title %}دسترسی غیرمجاز (۴۰۳) | ماهونیا{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 col-xl-5 text-center">
        <div class="card glass-card p-5">
            <div class="mb-4">
                <i class="bi bi-shield-slash fs-1 text-gold"></i>
            </div>
            <h3 class="fw-bold mb-3">عدم دسترسی به این بخش</h3>
            <p class="text-muted mb-4">
                حساب کاربری شما مجوز لازم برای مشاهده یا تغییر این بخش را ندارد. در صورت نیاز به دسترسی، با مدیر سیستم تماس بگیرید.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
                    <i class="bi bi-speedometer2"></i> بازگشت به داشبورد
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
