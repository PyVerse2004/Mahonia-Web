{% extends "base.html" %}

{% block title %}حذف شخص{% endblock %}

{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white">
        تایید حذف شخص
    </div>
    <div class="card-body">
        <p>آیا از حذف اطلاعات شخص «<strong>{{ object.debtor_name }}</strong>» (محصول: {{ object.product_name }}) مطمئن هستید؟</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">بله، حذف شود</button>
            <a href="{% url 'persons:person_list' %}" class="btn btn-secondary">انصراف</a>
        </form>
    </div>
</div>
{% endblock %}
