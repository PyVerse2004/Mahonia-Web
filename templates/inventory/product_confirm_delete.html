{% extends "base.html" %}

{% block title %}حذف محصول | {{ object.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card glass-card border-danger border-opacity-50">
            <div class="card-header d-flex align-items-center gap-2 text-danger">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span class="fs-5 fw-bold">تایید حذف محصول</span>
            </div>
            <div class="card-body p-4">
                <p class="fs-6 mb-3">
                    آیا از حذف محصول «<strong>{{ object.name }}</strong>» اطمینان دارید؟
                </p>
                <div class="alert alert-warning d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-circle-fill fs-5 flex-shrink-0"></i>
                    <div>این محصول برای همیشه از سیستم حذف می‌شود و این عملیات قابل بازگشت نیست.</div>
                </div>

                <form method="post" class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
                    {% csrf_token %}
                    <a href="{% url 'inventory:product_list' %}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-x-lg"></i> انصراف
                    </a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash3"></i> بله، حذف شود
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
